[package]
name = "vertex_redact"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
clap = { version = "4.0", features = ["derive"] }
csv  = "1.4.0"
exitcode = "1.1.2"
hmac = "0.12"
path-security = "0.2.0"
regex = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sprintf = "0.4.3"
strum = "0.28"
strum_macros = "0.28"
tempfile = "3"
thiserror = "2"
toml = "1.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
assert_fs = "1"   
float-cmp = "0.10.0"